<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litmus Agent Web UI</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .container {
            display: flex;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
        }
        .header {
            padding: 16px 20px;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { margin: 0; font-size: 18px; }
        .header .session { font-size: 12px; color: #aaa; }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .message {
            margin-bottom: 16px;
            max-width: 80%;
        }
        .message.user { margin-left: auto; }
        .message.assistant { margin-right: auto; }
        .bubble {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .message.user .bubble { background: #007bff; color: #fff; }
        .message.assistant .bubble { background: #e9ecef; color: #333; }
        .tool-calls {
            margin-top: 6px;
            font-size: 12px;
            color: #666;
        }
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }
        .input-area button {
            padding: 12px 24px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .input-area button:disabled { background: #aaa; }
        .side-panel {
            width: 400px;
            display: flex;
            flex-direction: column;
            background: #fafafa;
        }
        .side-panel h2 {
            margin: 0;
            padding: 16px 20px;
            font-size: 16px;
            border-bottom: 1px solid #e0e0e0;
            background: #fff;
        }
        .tool-events {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .event {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .event .tool-name {
            font-weight: bold;
            color: #007bff;
            margin-bottom: 6px;
        }
        .event .success { color: #28a745; }
        .event .fail { color: #dc3545; }
        .event pre {
            background: #f5f5f5;
            padding: 8px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 8px 0 0;
        }
        .empty {
            color: #999;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-panel">
            <div class="header">
                <h1>Litmus Agent</h1>
                <span class="session">Session: {{ session_id[:8] }}...</span>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="输入消息..." autofocus>
                <button id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>
        <div class="side-panel">
            <h2>工具调用 / Trace</h2>
            <div class="tool-events" id="toolEvents">
                <div class="empty">暂无工具调用</div>
            </div>
        </div>
    </div>

    <script>
        const sessionId = "{{ session_id }}";
        const messagesEl = document.getElementById("messages");
        const toolEventsEl = document.getElementById("toolEvents");
        const inputEl = document.getElementById("messageInput");
        const sendBtn = document.getElementById("sendBtn");

        inputEl.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        function appendMessage(role, content, toolCalls) {
            const div = document.createElement("div");
            div.className = `message ${role}`;
            let html = `<div class="bubble">${escapeHtml(content)}</div>`;
            if (toolCalls && toolCalls.length > 0) {
                const names = toolCalls.map(tc => tc.name).join(", ");
                html += `<div class="tool-calls">工具调用：${escapeHtml(names)}</div>`;
            }
            div.innerHTML = html;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function renderToolEvents(events) {
            if (events.length === 0) {
                toolEventsEl.innerHTML = '<div class="empty">暂无工具调用</div>';
                return;
            }
            toolEventsEl.innerHTML = "";
            events.forEach(ev => {
                const div = document.createElement("div");
                div.className = "event";
                const statusClass = ev.success ? "success" : "fail";
                const statusText = ev.success ? "成功" : "失败";
                div.innerHTML = `
                    <div class="tool-name">${escapeHtml(ev.tool)}</div>
                    <div>状态：<span class="${statusClass}">${statusText}</span></div>
                    <div>参数：${escapeHtml(JSON.stringify(ev.arguments))}</div>
                    <pre>${escapeHtml(ev.content)}</pre>
                `;
                toolEventsEl.appendChild(div);
            });
            toolEventsEl.scrollTop = toolEventsEl.scrollHeight;
        }

        function escapeHtml(text) {
            const map = {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"};
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;
            inputEl.value = "";
            sendBtn.disabled = true;
            appendMessage("user", text, null);

            try {
                const resp = await fetch(`/api/chat/${sessionId}`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({message: text})
                });
                if (!resp.ok) {
                    throw new Error(`HTTP ${resp.status}`);
                }
                const data = await resp.json();
                messagesEl.innerHTML = "";
                data.messages.forEach(m => appendMessage(m.role, m.content, m.tool_calls));
                renderToolEvents(data.tool_events);
            } catch (err) {
                appendMessage("assistant", `请求失败：${err.message}`, null);
            } finally {
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }
    </script>
</body>
</html>
