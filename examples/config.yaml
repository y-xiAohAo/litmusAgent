# Hermes Agent 示例配置文件
#
# 使用方式：
#   python examples/with_config.py
# 或 CLI：
#   agent run "帮我写一个排序算法" --config examples/config.yaml
#
# 注意：
#   1. 本配置未提供 api_key，示例代码使用 EchoClient 运行，
#      避免在无 API key 环境下失败。接入真实 LLM 时，
#      请在 llm.api_key 字段填入密钥，或设置 OPENAI_API_KEY 环境变量。
#   2. 当前项目仅实现了 Docker 沙箱后端；配置中的 sandbox.backend 虽然支持
#      "subprocess"，但该选项尚未真正落地。若未来接入真实 LLM 并触发 tool
#      调用，需要 Docker daemon 处于运行状态。

llm:
  provider: openai
  model: gpt-4o
  # api_key: sk-xxxxxxxxxxxxxxxxxxxxxxxx
  base_url: https://api.openai.com/v1
  temperature: 0.2
  max_tokens: 2048

agent:
  max_turns: 10
  system_prompt: "你是一名耐心的 Python 助教，回答简洁并附带可运行代码。"

sandbox:
  backend: docker
  image: python:3.11-slim
  timeout: 30
  memory_limit_mb: 256

tools:
  enabled:
    - sandbox_exec
    - finish
